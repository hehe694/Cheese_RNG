<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧀 CHEESE RNG 🎲</title>
  <style>
    /* Mobile Touch & Scroll Fixes */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: #0a0a0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow-x: hidden;
    }

    /* Main Container Card */
    #c-rng-ui {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: rgba(18, 18, 24, 0.96);
      backdrop-filter: blur(14px);
      border: 2px solid #ffaa00;
      border-radius: 26px;
      padding: 26px;
      box-shadow: 0 0 35px rgba(255, 170, 0, 0.35), 0 30px 60px rgba(0, 0, 0, 0.85);
      text-align: center;
      overflow: hidden;
    }

    /* Keyframe Animations */
    @keyframes cPop {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes cPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    @keyframes cLand {
      0% { transform: scale(1.25); filter: brightness(1.8); }
      60% { transform: scale(0.95); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    @keyframes cFlash {
      0% { background: rgba(255, 255, 255, 0.7); }
      100% { background: transparent; }
    }
    @keyframes rainbowGlow {
      0% { box-shadow: 0 0 25px #ff0000; }
      25% { box-shadow: 0 0 25px #ffff00; }
      50% { box-shadow: 0 0 25px #00ff00; }
      75% { box-shadow: 0 0 25px #0088ff; }
      100% { shadow: 0 0 25px #ff00ff; }
    }

    .c-rolling-card { animation: cPulse 0.4s infinite ease-in-out !important; }
    .c-land-fx { animation: cLand 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important; }
    .c-flash-fx { animation: cFlash 0.3s ease-out; }
  </style>
</head>
<body>

  <div id="c-rng-ui">
    <canvas id="c-canvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;"></canvas>
    
    <!-- Stats Badge -->
    <div style="position:absolute;top:14px;left:14px;display:flex;gap:6px;z-index:10;font-size:11px;font-weight:800;">
      <span style="background:rgba(255,149,0,0.2);color:#ff9500;padding:4px 8px;border-radius:10px;border:1px solid rgba(255,149,0,0.4);">🍀 <span id="c-st-l">+0%</span></span>
      <span style="background:rgba(90,200,250,0.2);color:#5ac8fa;padding:4px 8px;border-radius:10px;border:1px solid rgba(90,200,250,0.4);">⚡ <span id="c-st-s">-0%</span></span>
    </div>

    <div style="position:relative;z-index:2;">
      <div style="font-size:13px;font-weight:800;letter-spacing:2px;color:#ffaa00;text-transform:uppercase;margin-bottom:4px;">🧀 CHEESE RNG 🎲</div>
      <div style="font-size:15px;font-weight:900;color:#ffd700;margin-bottom:14px;background:rgba(255,215,0,0.1);padding:5px 14px;border-radius:14px;display:inline-block;border:1px solid rgba(255,215,0,0.3);">
        🧀 <span id="c-coins-val">0</span> Coins
      </div>

      <!-- MAIN ROLL VIEW -->
      <div id="c-roll-view">
        <div id="c-card" style="background:#181820;border-radius:18px;height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #2a2a38;margin-bottom:16px;padding:14px;box-sizing:border-box;transition:border-color 0.15s, box-shadow 0.15s;">
          <div style="font-size:48px;margin-bottom:6px;filter:drop-shadow(0 0 12px rgba(255,170,0,0.5));">🧀</div>
          <div style="font-size:16px;font-weight:600;color:#aaa;text-align:center;">Press Roll to Start</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="display:flex;gap:10px;">
            <button id="c-shop-btn" style="flex:1;background:#282835;color:#ffd700;border:1px solid rgba(255,215,0,0.3);padding:12px;border-radius:12px;font-weight:bold;font-size:13px;cursor:pointer;">🛒 SHOP</button>
            <button id="c-idx-btn" style="flex:1;background:#282835;color:#ffaa00;border:1px solid rgba(255,170,0,0.3);padding:12px;border-radius:12px;font-weight:bold;font-size:13px;cursor:pointer;">📖 INDEX</button>
          </div>
          <button id="c-btn" style="width:100%;background:linear-gradient(135deg,#ffaa00,#ff6600);color:#000;border:none;padding:14px;border-radius:14px;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 4px 15px rgba(255,170,0,0.4);">🎲 ROLL</button>
        </div>
      </div>

      <!-- SHOP VIEW -->
      <div id="c-shop-view" style="display:none;text-align:left;">
        <div style="background:#181820;border:1px solid #333;border-radius:14px;padding:12px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div style="font-weight:bold;color:#ff9500;font-size:14px;">🍀 Luck Boost (Lvl <span id="c-l-lvl">0</span>)</div>
            <div style="font-size:11px;color:#888;">+20% Luck per Lvl</div>
          </div>
          <button id="c-buy-l" style="background:#ffd700;color:#000;border:none;border-radius:10px;padding:8px 12px;font-weight:900;font-size:12px;cursor:pointer;">🧀 <span id="c-l-cost">50</span></button>
        </div>
        <div style="background:#181820;border:1px solid #333;border-radius:14px;padding:12px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div style="font-weight:bold;color:#5ac8fa;font-size:14px;">⚡ Roll Speed (Lvl <span id="c-s-lvl">0</span>)</div>
            <div style="font-size:11px;color:#888;">-7.5% Roll Time per Lvl</div>
          </div>
          <button id="c-buy-s" style="background:#ffd700;color:#000;border:none;border-radius:10px;padding:8px 12px;font-weight:900;font-size:12px;cursor:pointer;">🧀 <span id="c-s-cost">40</span></button>
        </div>
        <button id="c-back-btn" style="width:100%;background:#282835;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:bold;cursor:pointer;font-size:13px;margin-bottom:10px;">← BACK TO ROLLING</button>
        <button id="c-wipe-btn" style="width:100%;background:rgba(255,59,48,0.2);color:#ff3b30;border:1px solid rgba(255,59,48,0.5);padding:10px;border-radius:12px;font-weight:bold;cursor:pointer;font-size:12px;">💥 WIPE DATA</button>
      </div>

      <!-- INDEX VIEW -->
      <div id="c-idx-view" style="display:none;text-align:left;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <span style="font-weight:bold;font-size:14px;color:#ffaa00;">📖 CHEESE COLLECTION</span>
          <span style="font-size:12px;color:#aaa;font-weight:bold;"><span id="c-idx-cnt">0</span>/600</span>
        </div>
        <div id="c-idx-list" style="max-height:220px;overflow-y:auto;background:#14141c;border:1px solid #2a2a38;border-radius:14px;padding:8px;margin-bottom:10px;"></div>
        <button id="c-idx-back-btn" style="width:100%;background:#282835;color:#fff;border:none;padding:10px;border-radius:12px;font-weight:bold;cursor:pointer;font-size:13px;">← BACK TO ROLLING</button>
      </div>
    </div>
  </div>

  <script>
    let coins = parseInt(localStorage.getItem('c_rng_coins') || '0') || 0;
    let luckLvl = parseInt(localStorage.getItem('c_rng_luck') || '0') || 0;
    let spdLvl = parseInt(localStorage.getItem('c_rng_spd') || '0') || 0;
    let unlocked = [];
    try { unlocked = JSON.parse(localStorage.getItem('c_rng_unlocked') || '[]'); } catch(e) { unlocked = []; }

    let actx = null;
    function snd(f, t, v) {
      try {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        let o = actx.createOscillator(), g = actx.createGain();
        o.type = t || 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(v || 0.05, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.15);
        o.connect(g);
        g.connect(actx.destination);
        o.start();
        o.stop(actx.currentTime + 0.15);
      } catch(e) {}
    }

    const B = ["Cheddar","Gouda","Brie","Swiss","Camembert","Parmesan","Mozzarella","Provolone","Gruyère","Manchego","Blue Cheese","Feta","Havarti","Gorgonzola","Asiago","Ricotta","Fontina","Taleggio","Edam","Cotija","Emmental","Raclette","Roquefort","Pecorino","Monterey Jack","Colby","Stilton","Burrata","Münster","Halloumi","Mascarpone","Reblochon","Beaufort","Appenzeller","Mimolette","Oaxaca","Kasseri","Wensleydale","Red Leicester","Jarlsberg","Derby","Caerphilly","Mahón","Pont-l'Évêque","Époisses","Morbier","Tomme","Vacherin","Scamorza","Telepan","Abertam","Bresse Bleu","Cabrales","Danablu","Gjetost","Leyden","Majorero","Nokkelost","Roncal","Tilsit"];
    const T = [
      { m: 10, n: "Common", c: "#8e8e93", q: "A simple culinary slice." },
      { m: 50, n: "Uncommon", c: "#34c759", q: "Freshly crafted with rich texture." },
      { m: 250, n: "Rare", c: "#007aff", q: "Artisanal quality, perfectly aged." },
      { m: 1500, n: "Epic", c: "#af52de", q: "Exceptional flavor with rare spices." },
      { m: 10000, n: "Legendary", c: "#ff9500", q: "Masterwork wheel. Highly prized!" },
      { m: 100000, n: "Mythic", c: "#ff2d55", q: "Sought by grand connoisseurs worldwide." },
      { m: 1000000, n: "Exotic", c: "#5ac8fa", q: "Forged through ancient secrets." },
      { m: 10000000, n: "Divine", c: "#ffd700", q: "A sacred wheel of glowing gold!" },
      { m: Infinity, n: "Celestial", c: "#ffffff", q: "A mythical creation beyond mortals!" }
    ];

    const P = [];
    for (let i = 1; i <= 600; i++) {
      let val = Math.floor(2 * Math.pow(1.0275, i - 1));
      let tier = T.find(t => val < t.m) || T[T.length - 1];
      let bName = B[(i - 1) % B.length];
      let prefix = "";
      if (val >= 10000000) prefix = "COSMIC ETERNAL ";
      else if (val >= 1000000) prefix = "SANCTUM SUN ";
      else if (val >= 100000) prefix = "STARLIGHT ";
      else if (val >= 10000) prefix = "GRAND RESERVE ";
      else if (val >= 1500) prefix = "VINTAGE ";
      else if (val >= 250) prefix = "AGED ";
      else if (val >= 50) prefix = "CREAMY ";
      else if (val >= 10) prefix = "FARMHOUSE ";
      else prefix = "MILD ";

      P.push({ id: i, n: prefix + bName, val: val, strVal: "1/" + val.toLocaleString(), tier: tier, w: 1 / val });
    }

    function rollItem() {
      let luckMult = 1 + (luckLvl * 0.20);
      let dw = P.map(x => Math.pow(x.w, 1 / luckMult));
      let tw = dw.reduce((a, b) => a + b, 0);
      let r = Math.random() * tw;
      for (let i = 0; i < P.length; i++) {
        r -= dw[i];
        if (r <= 0) return P[i];
      }
      return P[P.length - 1];
    }

    const box = document.getElementById('c-rng-ui');
    const card = document.getElementById('c-card');
    const btn = document.getElementById('c-btn');
    const rView = document.getElementById('c-roll-view');
    const sView = document.getElementById('c-shop-view');
    const iView = document.getElementById('c-idx-view');
    let rolling = false;

    function burst(color) {
      let cv = document.getElementById('c-canvas');
      if (!cv) return;
      let ctx = cv.getContext('2d');
      cv.width = box.offsetWidth;
      cv.height = box.offsetHeight;
      let pts = [];
      for (let i = 0; i < 45; i++) {
        let ang = Math.random() * Math.PI * 2;
        let spd = Math.random() * 8 + 2;
        pts.push({ x: cv.width / 2, y: cv.height / 2, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, sz: Math.random() * 5 + 2, color: color, alpha: 1 });
      }
      function draw() {
        ctx.clearRect(0, 0, cv.width, cv.height);
        let active = false;
        pts.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= 0.025;
          if (p.alpha > 0) {
            active = true;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.sz, 0, Math.PI * 2);
            ctx.fill();
          }
        });
        if (active) requestAnimationFrame(draw);
      }
      draw();
    }

    document.getElementById('c-shop-btn').onclick = () => {
      rView.style.display = 'none';
      iView.style.display = 'none';
      sView.style.display = 'block';
      updateShop();
    };

    document.getElementById('c-idx-btn').onclick = () => {
      rView.style.display = 'none';
      sView.style.display = 'none';
      iView.style.display = 'block';
      updateIndex();
    };

    document.getElementById('c-back-btn').onclick = () => {
      sView.style.display = 'none';
      iView.style.display = 'none';
      rView.style.display = 'block';
    };

    document.getElementById('c-idx-back-btn').onclick = () => {
      sView.style.display = 'none';
      iView.style.display = 'none';
      rView.style.display = 'block';
    };

    function updateIndex() {
      document.getElementById('c-idx-cnt').innerText = unlocked.length;
      let h = '';
      for (let i = 0; i < P.length; i++) {
        let item = P[i];
        let isFound = unlocked.includes(item.id);
        if (isFound) {
          h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;margin-bottom:5px;background:#1c1c28;border-left:4px solid ' + item.tier.c + ';border-radius:8px;font-size:12px;"><div style="font-weight:bold;color:#fff;">#' + item.id + ' ' + item.n + '</div><div style="color:' + item.tier.c + ';font-weight:800;font-size:11px;">' + item.strVal + '</div></div>';
        } else {
          h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;margin-bottom:5px;background:#181820;border-left:4px solid #333;border-radius:8px;font-size:12px;opacity:0.4;"><div style="font-weight:bold;color:#777;">#' + item.id + ' ???</div><div style="color:#555;font-size:11px;">Locked</div></div>';
        }
      }
      document.getElementById('c-idx-list').innerHTML = h;
    }

    function updateShop() {
      let lCost = Math.floor(50 * Math.pow(1.5, luckLvl));
      let sCost = Math.floor(40 * Math.pow(1.5, spdLvl));
      document.getElementById('c-l-lvl').innerText = luckLvl;
      document.getElementById('c-l-cost').innerText = lCost.toLocaleString();
      document.getElementById('c-s-lvl').innerText = spdLvl;
      document.getElementById('c-s-cost').innerText = (spdLvl >= 5 ? 'MAX' : sCost.toLocaleString());
      document.getElementById('c-coins-val').innerText = coins.toLocaleString();
      if (document.getElementById('c-st-l')) document.getElementById('c-st-l').innerText = '+' + (luckLvl * 20) + '%';
      if (document.getElementById('c-st-s')) document.getElementById('c-st-s').innerText = '-' + parseFloat((spdLvl * 7.5).toFixed(1)) + '%';
    }

    document.getElementById('c-buy-l').onclick = () => {
      let lCost = Math.floor(50 * Math.pow(1.5, luckLvl));
      if (coins >= lCost) {
        coins -= lCost;
        luckLvl++;
        localStorage.setItem('c_rng_coins', coins);
        localStorage.setItem('c_rng_luck', luckLvl);
        snd(880, 'sine', 0.15);
        updateShop();
      } else {
        snd(150, 'sawtooth', 0.1);
      }
    };

    document.getElementById('c-buy-s').onclick = () => {
      if (spdLvl >= 5) return;
      let sCost = Math.floor(40 * Math.pow(1.5, spdLvl));
      if (coins >= sCost) {
        coins -= sCost;
        spdLvl++;
        localStorage.setItem('c_rng_coins', coins);
        localStorage.setItem('c_rng_spd', spdLvl);
        snd(880, 'sine', 0.15);
        updateShop();
      } else {
        snd(150, 'sawtooth', 0.1);
      }
    };

    document.getElementById('c-wipe-btn').onclick = () => {
      if (confirm('Are you sure you want to wipe all cheese progress? 🧀💥')) {
        localStorage.removeItem('c_rng_coins');
        localStorage.removeItem('c_rng_luck');
        localStorage.removeItem('c_rng_spd');
        localStorage.removeItem('c_rng_unlocked');
        coins = 0;
        luckLvl = 0;
        spdLvl = 0;
        unlocked = [];
        updateShop();
        snd(100, 'sawtooth', 0.2);
      }
    };

    btn.onclick = () => {
      if (rolling) return;
      rolling = true;
      btn.style.opacity = '0.5';
      card.classList.remove('c-land-fx');
      card.classList.add('c-rolling-card');
      let step = 0;
      let totalSteps = Math.round(Math.max(14, 24 - spdLvl * 1.5));
      let win = rollItem();

      let rollLoop = () => {
        step++;
        let isFinal = (step >= totalSteps);
        let currentItem = isFinal ? win : P[Math.floor(Math.random() * P.length)];
        card.style.borderColor = currentItem.tier.c;
        card.style.boxShadow = '0 0 20px ' + currentItem.tier.c + '88';
        card.innerHTML = '<div style="font-size:12px;font-weight:800;color:#ffaa00;letter-spacing:1px;margin-bottom:6px;">' + (isFinal ? 'DECIDING...' : 'ROLLING...') + '</div><div style="font-size:20px;font-weight:800;color:' + currentItem.tier.c + ';text-align:center;line-height:1.2;margin:4px 0;">' + currentItem.n + '</div><div style="font-size:11px;font-weight:700;color:#777;margin-top:4px;">' + currentItem.strVal + '</div>';

        let progress = step / totalSteps;
        let pitch = 500 - (progress * 250);
        snd(pitch, 'sine', 0.03);

        if (!isFinal) {
          let baseDelay = Math.max(22, 35 - spdLvl * 2.5);
          let delay = baseDelay;
          let halfSteps = Math.floor(totalSteps / 2);
          if (step > halfSteps && totalSteps > halfSteps) {
            let slowRatio = (step - halfSteps) / (totalSteps - halfSteps);
            delay = baseDelay + Math.pow(slowRatio, 2.5) * (400 - (spdLvl * 25));
          }
          setTimeout(rollLoop, delay);
        } else {
          if (!unlocked.includes(win.id)) {
            unlocked.push(win.id);
            localStorage.setItem('c_rng_unlocked', JSON.stringify(unlocked));
          }
          card.classList.remove('c-rolling-card');
          card.classList.add('c-land-fx');
          box.classList.add('c-flash-fx');
          setTimeout(() => box.classList.remove('c-flash-fx'), 300);

          let reward = Math.max(1, Math.floor(win.val / 2));
          coins += reward;
          localStorage.setItem('c_rng_coins', coins);
          document.getElementById('c-coins-val').innerText = coins.toLocaleString();

          if (win.val >= 100000) {
            snd(880, 'triangle', 0.2);
            setTimeout(() => snd(1174.66, 'triangle', 0.2), 120);
            setTimeout(() => snd(1396.91, 'triangle', 0.25), 240);
          } else if (win.val >= 1000) {
            snd(587.33, 'sine', 0.15);
            setTimeout(() => snd(880, 'sine', 0.2), 150);
          } else {
            snd(523.25, 'sine', 0.1);
          }

          burst(win.tier.c);
          card.style.borderColor = win.tier.c;
          card.style.boxShadow = '0 0 30px ' + win.tier.c + 'aa';
          card.innerHTML = '<div style="font-size:11px;color:#777;font-weight:700;margin-bottom:2px;">#' + win.id + ' / 600</div><div style="font-size:20px;font-weight:900;color:#fff;text-align:center;line-height:1.2;margin:4px 0;text-shadow:0 0 10px ' + win.tier.c + 'aa;">' + win.n + '</div><div style="display:inline-block;padding:4px 14px;border-radius:20px;background:' + win.tier.c + ';color:#000;font-weight:900;font-size:11px;letter-spacing:1px;margin:4px 0;">' + win.tier.n.toUpperCase() + ' (' + win.strVal + ')</div><div style="font-size:13px;font-weight:800;color:#ffd700;margin:2px 0;">+🧀 ' + reward.toLocaleString() + ' Coins</div><div style="font-size:11px;color:#ccc;font-style:italic;text-align:center;line-height:1.2;max-width:300px;">"' + win.tier.q + '"</div>';

          if (win.val >= 10000000) {
            box.style.animation = "rainbowGlow 2s infinite alternate";
          } else {
            box.style.animation = "cPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
          }

          btn.style.opacity = '1';
          btn.innerText = '🎲 ROLL AGAIN';
          rolling = false;
        }
      };
      rollLoop();
    };

    // Initialize stats display
    updateShop();
  </script>
</body>
</html>
